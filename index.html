<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pac-Man - Meu Primeiro Jogo</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>PAC-MAN</h1>

    <p>Use as setas do teclado para jogar!</p>

    <div id="hud">
      <span>PONTOS: <strong id="score">0</strong></span>
      <span>VIDAS: <strong id="lives">3</strong></span>
    </div>

    <div id="game-container"></div>

    <div id="game-overlay" class="hidden">
      <h2 id="game-message">GAME OVER!</h2>
      <p id="final-score"></p>
      <button id="restart-button">JOGAR NOVAMENTE</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
